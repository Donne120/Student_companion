
<!DOCTYPE html>
<html lang="en" class="sc-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="color-scheme" content="light" />

    <title>Student Companion AI</title>
    <meta name="description" content="Ask about courses, deadlines, opportunities and campus life, and get answers from your university’s own information in seconds." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS standalone app behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Student Companion AI" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Student Companion AI" />
    <meta property="og:title" content="Student Companion AI: your university’s answers, in seconds" />
    <meta property="og:description" content="Ask about courses, deadlines, opportunities and campus life, and get answers from your university’s own information in seconds." />
    <meta property="og:image" content="https://chat.studentcompanionai.rw/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Student Companion AI: your university’s answers, in seconds. chat.studentcompanionai.rw" />
    <meta property="og:url" content="https://chat.studentcompanionai.rw" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Student Companion AI: your university’s answers, in seconds" />
    <meta name="twitter:description" content="Ask about courses, deadlines, opportunities and campus life, and get answers from your university’s own information in seconds." />
    <meta name="twitter:image" content="https://chat.studentcompanionai.rw/og-image.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&display=swap" />
    <link rel="preload" as="image" href="/splash-mark.png" />
    <style>
      /* Shown the instant the page opens, before the app's code arrives, so
         visitors never see a blank white page. Removed by src/main.tsx once
         the app has drawn its first screen. */
      html.sc-loading, html.sc-loading body { background: #1A1A1A; }
      /* Intro: one large book opens across the screen, its pages flip, then
         it folds into the gold mark, which stays with "Welcome to Student
         Companion AI" until the app is ready (src/main.tsx removes it). */
      #sc-splash { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #2A2722 0%, #1A1A1A 65%);
        transition: opacity .55s ease, visibility .55s ease; }
      #sc-splash.sc-hide { opacity: 0; visibility: hidden; }
      .sc-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .sc-book { position: relative; width: min(78vw, 620px); aspect-ratio: 1.55; perspective: 1600px;
        animation: sc-book-in .5s cubic-bezier(.2,.7,.2,1) both, sc-book-out .55s cubic-bezier(.6,0,.4,1) 1.55s forwards; }
      .sc-book::before { content: ""; position: absolute; left: -2.2%; right: -2.2%; top: 3%; bottom: -4%;
        border-radius: 10px; background: linear-gradient(#C29A3A, #8A6A1F); box-shadow: 0 40px 80px rgba(0,0,0,.55); }
      .sc-page, .sc-leaf { position: absolute; top: 0; width: 50%; height: 100%;
        background: repeating-linear-gradient(#0000 0 7.5%, rgba(168,131,47,.20) 7.5% 7.8%) 50% 60% / 78% 72% no-repeat,
          linear-gradient(90deg, #EDE3C6, #FBF7E9); }
      .sc-page.l { left: 0; border-radius: 8px 0 0 8px; box-shadow: inset -26px 0 36px -26px rgba(120,90,30,.45); }
      .sc-page.r { left: 50%; border-radius: 0 8px 8px 0; background-color: #FBF7E9;
        box-shadow: inset 26px 0 36px -26px rgba(120,90,30,.45); }
      .sc-spine { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); background: rgba(168,131,47,.55); }
      .sc-leaf { left: 50%; border-radius: 0 8px 8px 0; transform-origin: left center; background-color: #FFFDF5;
        box-shadow: inset 26px 0 36px -26px rgba(120,90,30,.35), 0 0 0 1px rgba(168,131,47,.25);
        animation: sc-turn .62s cubic-bezier(.45,.05,.35,1) both; }
      .sc-leaf.a { animation-delay: .35s; } .sc-leaf.b { animation-delay: .55s; }
      .sc-leaf.c { animation-delay: .75s; } .sc-leaf.d { animation-delay: .95s; }
      .sc-end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .sc-end img { width: clamp(64px, 11vmin, 96px); height: auto; opacity: 0;
        animation: sc-mark-in .7s cubic-bezier(.2,.8,.2,1.15) 1.75s forwards, sc-float 3.2s ease-in-out 2.6s infinite; }
      .sc-end .sc-welcome { margin: 26px 16px 0; text-align: center; font: 500 clamp(22px, 3.6vmin, 34px)/1.25 "Playfair Display", Georgia, "Times New Roman", serif;
        letter-spacing: .02em; color: #F5EFDC; }
      .sc-end .sc-welcome i { font-style: normal; display: inline-block; white-space: pre; opacity: 0; transform: translateY(8px); filter: blur(4px);
        animation: sc-letter .5s ease forwards; animation-delay: calc(2.05s + var(--n) * .035s); }
      .sc-end .sc-welcome .g { color: #D4AF37; }
      @keyframes sc-book-in { from { opacity: 0; transform: rotateX(22deg) scale(.92) } to { opacity: 1; transform: none } }
      @keyframes sc-book-out { to { opacity: 0; transform: scale(.14); filter: blur(2px) } }
      @keyframes sc-turn { from { transform: rotateY(0) } 50% { transform: rotateY(-90deg) translateZ(14px); filter: brightness(.8) } to { transform: rotateY(-180deg) } }
      @keyframes sc-mark-in { from { opacity: 0; transform: scale(.35) rotate(-8deg) } to { opacity: 1; transform: none } }
      @keyframes sc-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes sc-letter { to { opacity: 1; transform: none; filter: none } }
      /* Later loads in the same session, and "reduce motion": skip straight to the logo and welcome. */
      html.sc-quick .sc-book { display: none; }
      html.sc-quick .sc-end img, html.sc-quick .sc-end .sc-welcome i { animation-delay: 0s; }
      @media (prefers-reduced-motion: reduce) {
        .sc-book { display: none; }
        #sc-splash *, #sc-splash *::before { animation: none !important; }
        .sc-end img, .sc-end .sc-welcome i { opacity: 1; transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <script>
      // A repeat load in this browser session skips the book and shows the welcome at once.
      try { if (sessionStorage.getItem("sc_splash_seen")) document.documentElement.classList.add("sc-quick"); } catch (e) {}
    </script>
    <div id="sc-splash" role="status" aria-label="Loading Student Companion AI">
      <div class="sc-stage">
        <div class="sc-book" aria-hidden="true">
          <div class="sc-page l"></div><div class="sc-page r"></div><div class="sc-spine"></div>
          <div class="sc-leaf a"></div><div class="sc-leaf b"></div><div class="sc-leaf c"></div><div class="sc-leaf d"></div>
        </div>
      </div>
      <div class="sc-end">
        <img src="/splash-mark.png" alt="" />
        <p class="sc-welcome" aria-hidden="true"><i style="--n:0">W</i><i style="--n:1">e</i><i style="--n:2">l</i><i style="--n:3">c</i><i style="--n:4">o</i><i style="--n:5">m</i><i style="--n:6">e</i><i style="--n:7"> </i><i style="--n:8">t</i><i style="--n:9">o</i><i style="--n:10"> </i><i style="--n:11">S</i><i style="--n:12">t</i><i style="--n:13">u</i><i style="--n:14">d</i><i style="--n:15">e</i><i style="--n:16">n</i><i style="--n:17">t</i><i style="--n:18"> </i><i style="--n:19">C</i><i style="--n:20">o</i><i style="--n:21">m</i><i style="--n:22">p</i><i style="--n:23">a</i><i style="--n:24">n</i><i style="--n:25">i</i><i style="--n:26">o</i><i style="--n:27">n</i><i style="--n:28"> </i><i class="g" style="--n:29">A</i><i class="g" style="--n:30">I</i></p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Safety net: if the app hasn't started after 12 s (a failed download,
      // an error), take the loading screen away rather than spin forever.
      setTimeout(function () {
        var s = document.getElementById("sc-splash");
        if (s) { s.classList.add("sc-hide"); document.documentElement.classList.remove("sc-loading"); }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
